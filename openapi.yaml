                engagementTypes: { type: object, additionalProperties: true }
                collaboratorIds: { type: array, items: { type: integer } }
                collaboratorGroupId: { type: integer }
                transactionCompilers: { type: object, additionalProperties: true }
                lineItemFilters: { type: object, additionalProperties: true }
                postAllocationActions: { type: object, additionalProperties: true }
                metricFilters: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /distributors/{id}:
    get:
      tags: [Distributors]
      operationId: getDistributor
      summary: Get a distributor
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Fields' }
        - name: include
          in: query
          schema: { type: string }
          description: Send `extended` for the summary fields when `fields` is not given.
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Distributors]
      operationId: updateDistributor
      summary: Update a distributor
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                distributionResolver: { type: string }
                distributionPoolResolver: { type: string, example: revenueSinceLastDistribution }
                status: { type: string, enum: [active, inactive] }
                units: { type: string }
                revenuePercentage: { type: number }
                schedule: { type: array, items: { type: string }, example: [first day of next month] }
                engagementTypes: { type: object, additionalProperties: true }
                collaboratorIds: { type: array, items: { type: integer } }
                collaboratorGroupId: { type: integer }
                transactionCompilers: { type: object, additionalProperties: true }
                lineItemFilters: { type: object, additionalProperties: true }
                postAllocationActions: { type: object, additionalProperties: true }
                metricFilters: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Distributors]
      operationId: deleteDistributor
      summary: Delete a distributor
      description: |
        The first call marks the record `deleted` and returns it. A second call on a
        deleted record removes it and answers 204.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /distributors/bulk:
    post:
      tags: [Distributors]
      operationId: bulkDistributors
      summary: Run a bulk action on distributors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action: { type: string, enum: [activate, deactivate, restore, delete, permanent_delete] }
                ids: { type: array, items: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /distributors/credit-metric:
    post:
      tags: [Distributors]
      operationId: creditDistributorMetric
      summary: Credit a manual metric to a collaborator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId]
              properties:
                collaboratorId: { type: integer }
      responses:
        '200':
          description: Credited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /currencies/custom:
    get:
      tags: [Custom Currencies]
      operationId: listCustomCurrencies
      summary: List custom currencies
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - name: orderBy
          in: query
          schema: { type: string, enum: [code, name, symbol, symbolPosition, type, exchangeRate, dateCreated, dateModified] }
        - name: type
          in: query
          schema: { type: string, enum: [internal, monetary] }
        - name: code
          in: query
          schema: { type: string }
          description: One currency by its code. The PHP SDK's `retrieve()` uses it.
          example: STORE_CREDIT
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Custom Currencies]
      operationId: createCustomCurrency
      summary: Create a custom currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, symbol, type]
              properties:
                code: { type: string, description: Upper case and unique. Real currency codes are refused. }
                name: { type: string }
                symbol: { type: string }
                symbolPosition: { type: string, enum: [before, after] }
                type: { type: string, enum: [internal, monetary] }
                exchangeRate: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /currencies/custom/{code}:
    put:
      tags: [Custom Currencies]
      operationId: updateCustomCurrency
      summary: Update a custom currency
      description: |
        The type cannot change. Siren answers 400 when the body sends `type`.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: PTS }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                symbol: { type: string }
                symbolPosition: { type: string, enum: [before, after] }
                exchangeRate: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Custom Currencies]
      operationId: deleteCustomCurrency
      summary: Delete a custom currency
      description: |
        Sets every program that pays in the currency to `inactive`, deletes the
        currency, and answers `{success, deactivatedPrograms}`. With
        `wipeLedger` true, the ledger entries in the currency are deleted too.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: PTS }
        - name: wipeLedger
          in: query
          schema: { type: boolean }
          description: Also delete the ledger entries that use the currency.
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /credits/adjust:
    post:
      tags: [Credits]
      operationId: adjustCreditBalance
      summary: Adjust a collaborator's credit balance
      description: |
        Only a dashboard session may adjust a balance. Read balances with
        `GET /credit-balances` and the ledger with `GET /credit-entries`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId, currency, amount]
              properties:
                collaboratorId: { type: integer }
                currency: { type: string, description: An internal custom currency code. }
                amount: { type: integer, description: Minor units. Negative takes credit away. Must not be zero. }
                description: { type: string }
      responses:
        '200':
          description: Adjusted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /credit-balances:
    get:
      tags: [Credits]
      operationId: getCreditBalances
      summary: Read a collaborator's store credit for a checkout
      description: |
        One row per internal currency. `balance` is the ledger sum, `reserved`
        the live holds, and `available` the balance less reserved, never below
        zero, all in minor units. Pass the checkout's own hold reference as
        `excludeReference` so its hold does not count against itself. A
        connected site sends the plain reference and Cloud adds its Property.
      parameters:
        - { name: collaboratorId, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: currency, in: query, schema: { type: string, maxLength: 50 }, description: Just this internal currency. }
        - name: excludeReference
          in: query
          schema: { $ref: '#/components/schemas/HoldReference' }
      responses:
        '200':
          description: The balances.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CreditBalance' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /credit-entries:
    get:
      tags: [Credits]
      operationId: listCreditEntries
      summary: List store credit ledger entries
      description: |
        A query must name `collaboratorId` or `idempotencyKey`, so it never
        lists a whole organization's ledger. Every filter is an exact match.
        Only Siren writes the ledger.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [id, dateCreated, amount], default: id } }
        - { name: collaboratorId, in: query, schema: { type: integer } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: sourceType, in: query, schema: { type: string } }
        - { name: sourceId, in: query, schema: { type: string } }
        - { name: description, in: query, schema: { type: string } }
        - { name: idempotencyKey, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /credit-holds:
    get:
      tags: [Credits]
      operationId: listCreditHolds
      summary: List store credit holds
      description: |
        A query must name `collaboratorId`, `reference` or `idempotencyKey`.
        Every filter is an exact match. A connected site reads only the holds
        its own checkouts placed, and their references come back with its
        Property, as in `hold:woocommerce@property:5:{token}`.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [id, dateCreated, expiresAt], default: id } }
        - { name: collaboratorId, in: query, schema: { type: integer } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, settled, released, expired] } }
        - { name: reference, in: query, schema: { $ref: '#/components/schemas/HoldReference' } }
        - { name: idempotencyKey, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Credits]
      operationId: placeCreditHold
      summary: Reserve store credit for a checkout
      description: |
        Placing again for the same token and currency replaces that session's
        hold. The hold's `amount` may be lower than asked, because Siren caps
        it at the credit available outside this session's own hold. A hold
        lapses at its `ttl`, the site can release it early with
        `DELETE /credit-holds/{id}`, and Siren settles it when the order's
        redemption arrives as an event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId, currency, amount, token, platformId]
              properties:
                collaboratorId: { type: integer, minimum: 1 }
                currency: { type: string, description: An internal custom currency code. }
                amount: { type: integer, minimum: 1, description: Minor units. }
                token: { $ref: '#/components/schemas/SiteName', description: 'The checkout session, at most 120 characters.' }
                platformId: { $ref: '#/components/schemas/SiteName', description: 'The commerce platform, such as woocommerce. Plain. Cloud adds the Property (`@property:5`) and then allows at most 60 characters, suffix included.' }
                ttl: { type: integer, minimum: 60, maximum: 3600, default: 1800 }
      responses:
        '201':
          description: Placed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditHold' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            No credit is available in that currency (`error.code`
            `hold_no_credit`), or another site's checkout already holds
            credit for this collaborator and currency under the same token
            (`hold_token_in_use`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            The site spent its request budget (with `Retry-After`). Siren no
            longer caps how many checkouts hold a collaborator's credit, so it
            never sends `hold_limit`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /credit-holds/{id}:
    delete:
      tags: [Credits]
      operationId: releaseCreditHold
      summary: Release a store credit hold early
      description: |
        Releases one hold, so the credit it reserved is available again. Call
        it only when the shopper abandons the credit, or it no longer applies
        to a cart that never became an order. Never release the hold of a
        checkout that became an order: settlement consumes that hold, and
        releasing it first lets another checkout spend the same credit.
        A hold that already ended (released, expired or settled) comes back
        unchanged with 200, so a retry is safe. A connected site may release
        only holds its own checkouts placed, and any other id answers 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The hold, now released, or as it was when it had already ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditHold' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /collaborator-aliases:
    get:
      tags: [Collaborators]
      operationId: listCollaboratorAliases
      summary: Find tracking and coupon codes
      description: |
        Every filter is an exact match, and `type` matches the plain type in
        every namespace, so `coupon` also finds a site's `coupon@property:5`.
        Newest first. `?code=SAVE10&type=coupon&number=1` answers "who holds
        this coupon". A connected site sends one plain type.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: order, in: query, schema: { type: string, enum: [ASC, DESC], default: DESC } }
        - { name: orderBy, in: query, schema: { type: string, enum: [dateIssued, code, type, collaboratorId], default: dateIssued } }
        - { name: code, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/SiteName' }, example: coupon }
        - { name: collaboratorId, in: query, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Collaborators]
      operationId: createCollaboratorAlias
      summary: Give a collaborator a code
      description: |
        A code has one holder per type across every namespace. Cloud files a
        connected site's code under the site's Property.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, type, collaboratorId]
              properties:
                code: { type: string }
                type: { $ref: '#/components/schemas/SiteName' }
                collaboratorId: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alias' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Someone already holds the code under this type, in any namespace (`error.code` `code_held`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Collaborators]
      operationId: freeCollaboratorAlias
      summary: Free one code of one type
      description: |
        A connected site frees only codes in its own namespace. Freeing a code
        nobody holds answers 200 too.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { $ref: '#/components/schemas/SiteName' } }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /collaborator-programs:
    get:
      tags: [Collaborators]
      operationId: listCollaboratorPrograms
      summary: List program enrollments
      description: One row `{collaboratorId, programId}` per enrollment. A comma-separated value matches any of its values.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [collaboratorId, programId], default: collaboratorId } }
        - { name: collaboratorId, in: query, schema: { type: string }, example: '4' }
        - { name: programId, in: query, schema: { type: string }, example: '2,3' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Collaborators]
      operationId: addCollaboratorToProgram
      summary: Enroll a collaborator in a program
      description: |
        Enrolling someone already enrolled changes nothing and still answers
        201. A connected site may only name a program that runs on its own
        Property.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId, programId]
              properties:
                collaboratorId: { type: integer, minimum: 1 }
                programId: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Enrolled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Collaborators]
      operationId: removeCollaboratorFromProgram
      summary: End one enrollment
      description: Removing an enrollment that does not exist answers 200 too. A connected site may only name a program that runs on its own Property.
      parameters:
        - { name: collaboratorId, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: programId, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /mappings:
    get:
      tags: [Mappings]
      operationId: listMappings
      summary: Find links to records outside Siren
      description: |
        A query must name a type. A connected site must name `externalType`,
        reads only its own namespace, and may never use the `user` type.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [localId, externalId, localType, externalType], default: localId } }
        - { name: localId, in: query, schema: { type: integer } }
        - { name: localType, in: query, schema: { $ref: '#/components/schemas/SiteName' }, example: collaborator }
        - { name: externalId, in: query, schema: { type: string } }
        - { name: externalType, in: query, schema: { $ref: '#/components/schemas/SiteName' }, example: wordpress_user }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Mappings]
      operationId: createMapping
      summary: Link a collaborator to an outside record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [localId, localType, externalId, externalType]
              properties:
                localId: { type: integer, minimum: 1, description: A collaborator id. }
                localType: { type: string, enum: [collaborator] }
                externalId: { type: string }
                externalType: { $ref: '#/components/schemas/SiteName' }
      responses:
        '201':
          description: Linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mapping' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The link already exists (`error.code` `mapping_exists`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Mappings]
      operationId: deleteMappings
      summary: Remove collaborator links
      description: |
        Send `localId`, or `externalId` with its `externalType`. A connected
        site always sends `externalType`.
      parameters:
        - { name: localType, in: query, required: true, schema: { type: string, enum: [collaborator] } }
        - { name: localId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: externalId, in: query, schema: { type: string } }
        - { name: externalType, in: query, schema: { $ref: '#/components/schemas/SiteName' } }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /configs:
    get:
      tags: [Settings]
      operationId: listSharedConfigs
      summary: Read the settings shared with a connected site
      description: |
        Only named settings leave Cloud. Today that is `collaborator` /
        `urlReference` / `key`, the referral link's query parameter.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [type, subtype, configKey], default: type } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [collaborator] } }
        - { name: subtype, in: query, schema: { type: string }, example: urlReference }
        - { name: configKey, in: query, schema: { type: string }, example: key }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /collaborator-groups:
    get:
      tags: [Collaborator Groups]
      operationId: listCollaboratorGroups
      summary: List collaborator groups
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - name: orderBy
          in: query
          schema: { type: string, enum: [id, name, description, structure, dateCreated, dateModified] }
        - name: structure
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Collaborator Groups]
      operationId: createCollaboratorGroup
      summary: Create a collaborator group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, structure]
              properties:
                name: { type: string }
                description: { type: string }
                structure: { type: string, example: flat }
                members: { type: array, items: { $ref: '#/components/schemas/GroupMember' } }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /collaborator-groups/{id}:
    get:
      tags: [Collaborator Groups]
      operationId: getCollaboratorGroup
      summary: Get a collaborator group
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Fields' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Collaborator Groups]
      operationId: updateCollaboratorGroup
      summary: Update a collaborator group
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                structure: { type: string }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Collaborator Groups]
      operationId: deleteCollaboratorGroup
      summary: Delete a collaborator group
      description: |
        Deletes the group for good and answers 204.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collaborator-groups/{id}/members:
    get:
      tags: [Collaborator Groups]
      operationId: listCollaboratorGroupMembers
      summary: List a group's members
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - name: orderBy
          in: query
          schema: { type: string, enum: [id, groupId, collaboratorId, dateCreated, dateModified] }
        - { $ref: '#/components/parameters/Id' }
        - name: collaboratorId
          in: query
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Collaborator Groups]
      operationId: addCollaboratorGroupMembers
      summary: Add members to a group
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                members: { type: array, items: { $ref: '#/components/schemas/GroupMember' } }
      responses:
        '200':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    put:
      tags: [Collaborator Groups]
      operationId: setCollaboratorGroupMembers
      summary: Replace a group's members
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                members: { type: array, items: { $ref: '#/components/schemas/GroupMember' } }
      responses:
        '200':
          description: Replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /collaborator-groups/{id}/members/{collaboratorId}:
    delete:
      tags: [Collaborator Groups]
      operationId: removeCollaboratorGroupMember
      summary: Remove a member from a group
      description: |
        Removes one collaborator from the group.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: collaboratorId, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collaborator-groups/structures:
    get:
      tags: [Collaborator Groups]
      operationId: listCollaboratorGroupStructures
      summary: List group structures
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /obligations:
    get:
      tags: [Reconciliation]
      operationId: listObligations
      summary: List obligations
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - { name: id, in: query, schema: { type: integer } }
        - { name: collaboratorId, in: query, schema: { type: integer } }
        - name: status
          in: query
          schema: { type: string, enum: [draft, pending, approved, rejected, complete, deleted, cancelled] }
        - { name: awardType, in: query, schema: { type: string } }
        - { name: payoutId, in: query, schema: { type: integer } }
        - { name: opportunityId, in: query, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /payouts:
    get:
      tags: [Reconciliation]
      operationId: listPayouts
      summary: List payouts
      description: |
        A connected site must send `id`, `collaboratorId` or `fulfillmentId`,
        or Siren Cloud answers 403 `site_filter_required`.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - { name: id, in: query, schema: { type: integer } }
        - { name: fulfillmentId, in: query, schema: { type: integer } }
        - { name: collaboratorId, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
        - { name: currency, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: sk_live_...
      description: |
        An API key minted in the Siren dashboard or via createApiKey. It sends
        events and is refused on every other route.
    dashboardSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token of a person signed in to the Siren dashboard. Some
        routes need the admin role, and refuse other roles with a 403 whose
        code is `admin_required`.
    connectorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A connected site's OAuth access token, issued by `POST /oauth/token`
        when an organization admin approves the site. It expires, and the
        site renews it with its refresh token. Siren answers 401 when it has
        expired, or when the site was revoked. A site asks for
        `connect:* connect:webhooks connect:records:read connect:records:write`.
        Cloud files the types, platforms and tokens a site writes under the
        site's Property (`coupon@property:5`) and takes the Property from the
        token.
  headers:
    XSirenOID:
      description: The opportunity (tracking) id associated with the event, a whole number.
      schema: { type: integer }
  parameters:
    Number:
      name: number
      in: query
      description: |
        Page size. Siren answers 400 below 1 and lowers a size above 200 to
        200. The PHP SDK also accepts
        `perPage` and `page` and turns them into `number` and `offset`.
      schema: { type: integer, minimum: 1, maximum: 200, default: 10 }
    Offset:
      name: offset
      in: query
      description: The first row to return, counting from 0.
      schema: { type: integer, minimum: 0, default: 0 }
    Fields:
      name: fields
      in: query
      description: Comma-separated fields to return. Each list has a default set.
      schema: { type: string }
      example: id,status,dateCreated
    Order:
      name: order
      in: query
      schema: { type: string, enum: [ASC, DESC] }
    Search:
      name: s
      in: query
      description: A search term matched against the resource's text columns.
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    Record:
      type: object
      description: |
        A Siren record. The fields present depend on the resource and on the
        `fields` the request asked for.
      additionalProperties: true
    ListEnvelope:
      type: object
      required: [items, total, page, perPage, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Record' }
        total: { type: integer, description: Records across all pages. }
        page: { type: integer, description: 'floor(offset / number) + 1' }
        perPage: { type: integer, description: The page size used. }
        totalPages: { type: integer }
    SiteName:
      type: string
      pattern: '^[A-Za-z0-9_-]+$'
      description: |
        A plain type, platform or token: letters, digits, underscores and
        hyphens. Cloud refuses an `@` qualifier or a comma from a connected
        site, and adds the site's Property itself.
    HoldReference:
      type: string
      pattern: '^hold:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+$'
      description: A checkout session's hold reference, `hold:{platform}:{token}`, as a site sends it.
      example: hold:woocommerce:0b6f3c2e-8a1d-4c55-9a0e-0d6c1b7f4e21
    Alias:
      type: object
      properties:
        code: { type: string, example: SAVE10 }
        type: { type: string, description: 'Qualified for a connected site, as in coupon@property:5. The PHP SDK returns the plain type and the Property in propertyId.' }
        collaboratorId: { type: integer }
        dateIssued: { type: string }
    Enrollment:
      type: object
      properties:
        collaboratorId: { type: integer }
        programId: { type: integer }
    Mapping:
      type: object
      properties:
        localId: { type: integer }
        localType: { type: string, example: collaborator }
        externalId: { type: string }
        externalType: { type: string, description: 'Qualified for a connected site, as in wordpress_user@property:5. The PHP SDK returns the plain type and the Property in propertyId.' }
    CreditBalance:
      type: object
      properties:
        collaboratorId: { type: integer }
        currency: { type: string }
        balance: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
        held:
          type: integer
          description: Credit a store's migration imported that waits for an admin's approval. Not part of the balance.
    CreditHold:
      type: object
      properties:
        id: { type: integer }
        collaboratorId: { type: integer }
        currency: { type: string }
        amount: { type: integer }
        status: { type: string, enum: [active, settled, released, expired] }
        reference: { type: string, example: 'hold:woocommerce@property:5:0b6f3c2e-8a1d-4c55-9a0e-0d6c1b7f4e21' }
        idempotencyKey: { type: [string, 'null'] }
        expiresAt: { type: string }
        createdDate: { type: string }
    TransactionDetail:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        description: { type: string }
        type: { type: string, example: credit }
        value: { type: integer, description: Per-unit value in minor units. }
        quantity: { type: integer, default: 1 }
        units: { type: string, example: USD }
        attributes: { type: object, additionalProperties: true }
    GroupMember:
      type: object
      required: [collaboratorId]
      properties:
        collaboratorId: { type: integer, minimum: 1 }
        metadata:
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
    SalePayload:
      type: object
      required: [source, externalId, total, trackingId]
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 249
          description: Commerce source identifier.
          example: stripe
        externalId:
          type: string
          minLength: 1
          maxLength: 32
          description: Your order/transaction id; used to match refunds later.
          example: cs_test_a1b2c3
        total:
          type: number
          description: Order total in major currency units.
          example: 49.99
        trackingId:
          type: integer
          minimum: 0
          description: Opportunity id from the Siren tracking cookie / attribution.
          example: 4021
        currency:
          type: string
          description: |
            A currency code the organization uses. Every line is recorded in
            it. Without it the sale is recorded in the organization's default
            currency.
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/LineItem' }
    LineItem:
      type: object
      required: [amount]
      properties:
        externalId: { type: string }
        name: { type: string, example: Pro Plan (annual) }
        quantity: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        amount:
          type: number
          description: Per-unit price in major currency units.
          example: 49.99
    RefundPayload:
      type: object
      required: [source, externalId]
      properties:
        source: { type: string, example: stripe }
        externalId: { type: string, example: cs_test_a1b2c3 }
    SiteVisitedPayload:
      type: object
      required: [collaboratorId]
      properties:
        collaboratorId:
          description: A collaborator id, or a tracking code such as `tracking:summer-sale`.
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: string }
          example: 88
        userId: { type: integer, minimum: 1, example: 12345 }
    SaleResult:
      type: object
      properties:
        status:
          type: string
          enum: [created, recorded, duplicate, unattributed, ignored]
        created: { type: boolean }
        transactionId: { type: [integer, 'null'] }
        conversions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              status: { type: string }
        reason:
          type: string
          description: Why a recorded sale earned nothing.
          enum: [no_engagement, engagement_used, engagement_ended, not_awarded]
        message: { type: string }
    SiteVisitedResult:
      type: object
      properties:
        status:
          type: string
          enum: [attributed, recorded, not_attributed]
        attributed: { type: boolean }
        opportunityId: { type: [integer, 'null'] }
        reason:
          type: string
          enum: [collaborator_not_found, collaborator_not_active]
        message: { type: string }
    EventQueued:
      type: object
      properties:
        status: { type: string, const: queued }
        queued: { type: boolean, const: true }
        attributed: { type: boolean, description: A visit only. Always false. }
        opportunityId:
          type: integer
          description: A visit only. The opportunity the visit will be recorded on.
        message: { type: string }
    WebhookCatalogEntry:
      type: object
      properties:
        event: { $ref: '#/components/schemas/WebhookEventType' }
        category: { type: string, example: Sales }
        label: { type: string, example: A sale was recorded }
    WebhookSubscription:
      type: object
      properties:
        id: { type: integer }
        targetUrl: { type: string, format: uri }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        description: { type: string }
        status: { type: string, example: active }
        urlValid: { type: boolean }
        urlProblem: { type: [string, 'null'] }
        propertyId: { type: [integer, 'null'] }
        oauthClientId: { type: [string, 'null'] }
        dateCreated: { type: [string, 'null'], format: date-time }
        dateModified: { type: [string, 'null'], format: date-time }
    WebhookSubscriptionCreate:
      type: object
      required: [targetUrl, events]
      properties:
        targetUrl: { type: string, format: uri, example: https://example.com/webhooks/siren }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
          example: ['conversion.approved', 'payout.paid']
        description: { type: string }
    WebhookEventType:
      type: string
      description: A subscribable event type. Use `*` to subscribe to all.
      enum:
        - '*'
        - allocation.completed
        - collaborator.created
        - collaborator.deactivated
        - collaborator.registered
        - collaborator.updated
        - conversion.approved
        - conversion.created
        - conversion.rejected
        - conversion.renewed
        - coupon.applied
        - credit.issued
        - credit.redeemed
        - currency.created
        - currency.deleted
        - distribution.completed
        - engagement.awarded
        - engagement.completed
        - engagement.created
        - fulfillment.created
        - fulfillment.updated
        - lead.created
        - metrics.updated
        - obligation.completed
        - obligation.created
        - opportunity.created
        - opportunity.invalidated
        - payout.created
        - payout.paid
        - program.created
        - refund.created
        - renewal.created
        - sale.created
        - transaction.completed
        - transaction.created
    ApiKey:
      type: object
      properties:
        id: { type: integer }
        keyPrefix: { type: string, example: sk_live_a1b2c3d4 }
        label: { type: string }
        status: { type: string, example: active }
        propertyId: { type: [integer, 'null'] }
        scopes:
          type: array
          items: { type: string }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        dateCreated: { type: [string, 'null'], format: date-time }
        dateModified: { type: [string, 'null'], format: date-time }
    ApiKeyCreate:
      type: object
      required: [scopes]
      properties:
        label: { type: string, example: Production server }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          example: ['event:*']
          description: |
            Event scopes: `event:*` for every event, or `event:{slug}` for one
            event type. `*` is also accepted and grants what `event:*` grants.
            A record scope such as `programs:read` is refused with 400.
        expiresAt:
          type: string
          format: date-time
          description: When the key stops working. Must be in the future.
        propertyId:
          type: integer
          minimum: 1
          description: Stamps the key's events with this Property of the organization.
    Error:
      type: object
      description: |
        `error` is polymorphic. Some endpoints return a plain string message,
        and structured errors return an object with `message`, `code` and
        `data` or `context`. Clients must handle both. A connector's 401,
        403 and 409, and every 403 of a signed-in caller, carry a stable
        `code` (see `ErrorCode` in the SDK): `site_disconnected`,
        `missing_scope`, `field_not_allowed`, `pending_status_required`,
        `user_type_not_allowed`, `program_not_on_site`,
        `collaborator_not_on_site`, `site_filter_required`,
        `report_not_allowed`, `migration_closed`, `not_permitted`,
        `plan_required`, `admin_required`, `code_held`, `mapping_exists`,
        `hold_no_credit`, `hold_token_in_use`, `reserved_address` (422) and
        `plan_unavailable` (503). Siren no longer sends `hold_limit`, because
        it no longer caps credit holds. Branch on the code, not the message.
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                message: { type: string }
                code: { type: string }
                data: { type: object, additionalProperties: true }
                context:
                  type: object
                  additionalProperties: true
                  description: |
                    Sent by the record routes. A failed validation carries
                    `type: VALIDATION_FAILED` and `failedValidations`, a map
                    of field name to messages.
  responses:
    PaginatedList:
      description: |
        One page of records in Siren's list envelope. The total also appears
        in the `x-siren-estimated-count` response header.
      headers:
        x-siren-estimated-count:
          schema: { type: integer }
          description: Total number of records across all pages.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ListEnvelope' }
    Record:
      description: A record, or the result of an action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Record' }
    Deleted:
      description: Removed, or nothing matched.
      content:
        application/json:
          schema:
            type: object
            properties:
              deleted: { type: boolean, const: true }
    BadRequest:
      description: A query parameter is out of range, such as `number` below 1 or a negative `offset`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The record would duplicate one that exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid, expired or revoked credential.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        The credential may not do this. For a connected site, `error.code`
        `missing_scope` means the site must reconnect, and
        `error.context.scope` names the scope. The codes
        `field_not_allowed`, `pending_status_required`,
        `user_type_not_allowed`, `program_not_on_site`,
        `collaborator_not_on_site`, `site_filter_required` (with
        `error.context.anyOf`), `report_not_allowed` and `not_permitted` are
        policy refusals, and `error.context.param` names the refused field
        when there is one. `plan_required` means the plan does not include the
        feature, `admin_required` that only an admin may do this, and
        `migration_closed` that an admin must approve the site's connection
        again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: |
        The request failed validation. Siren answers 400 with
        `error.context.type` set to `VALIDATION_FAILED` and the per-field
        messages in `error.context.failedValidations`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EventQueued:
      description: |
        The organization's engine is paused, so Siren queued the event and
        processes it once the engine resumes. Do not send it again. When the
        queue is full Siren answers 429 instead.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EventQueued' }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
