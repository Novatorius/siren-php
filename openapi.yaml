openapi: 3.1.0
info:
  title: Siren Affiliate Platform API
  version: 0.2.0
  summary: Headless affiliate & incentive tracking API for the Siren SaaS.
  description: |
    The Siren API lets any commerce stack record sales, refunds, and referred
    visits, subscribe to program events via signed webhooks, and reconcile
    Siren's ledger against its own.

    This document describes the **developer and connector surface**: event
    ingestion, webhooks, API keys, and the record endpoints a connector (such
    as the Siren WordPress plugin connected to Siren Cloud) reads and writes:
    collaborators and their tracking codes and program enrollments,
    programs, program groups, opportunities, transactions, conversions,
    engagements, distributors, custom currencies, store credit, and
    collaborator groups.

    Requests authenticate with a bearer token. Event ingestion
    (`POST /event/{eventSlug}`) accepts an organization API key
    (`Authorization: Bearer sk_live_...`), and a connected site's OAuth access
    token for the events its integrations forward and `site-visited`. An API
    key works on the event routes only. API keys and webhook subscriptions
    are managed with a signed-in dashboard session. The record routes accept
    a signed-in dashboard session, and a
    connected site's token on the routes Siren Cloud opens to connectors,
    when the token holds `connect:records:read` for reads or
    `connect:records:write` for writes. Those are explicit scopes, so
    `connect:*` does not grant them. A site writes only collaborators (as
    `pending`, without program, distributor or group lists, and on update
    only `fullName`, `nickname` and custom `fields`), codes, enrollments,
    collaborator mappings and credit holds. A site reads only the fields its
    datastores need, may not send `include`, and must filter opportunities
    and payouts to one collaborator or record (`site_filter_required`). A
    403 that names a scope means the site must reconnect.
    Any other 403 is a policy refusal. A 401 saying the site is no longer
    connected means it was revoked.

    Successful responses are bare JSON: an object for one record, and the
    list envelope `{ "items", "total", "page", "perPage", "totalPages" }`
    for lists. Lists page with `number` (page size, at most 200) and
    `offset`. Failures return `{ "error": ... }`, where `error` is a string
    or `{ "message", "code", "data" }`.

    Record deletes for collaborators, programs, conversions and
    distributors are two-stage. The first DELETE marks the record `deleted`
    and returns it, and a second DELETE removes it with 204. Program groups,
    collaborator groups and group members are removed on the first DELETE,
    which answers 204. A bulk action takes at most 500 ids.
  contact:
    name: Siren
    url: https://sirenaffiliates.com
  license:
    name: Proprietary
servers:
  - url: https://api.sirenaffiliates.com/siren/v1
    description: Production
  - url: http://localhost:8080/siren/v1
    description: Local development
security:
  - dashboardSession: []
  - connectorToken: []
tags:
  - name: Events
    description: Ingest commerce and tracking events.
  - name: Webhooks
    description: Subscribe to program events; delivered as signed HTTP callbacks.
  - name: API Keys
    description: Manage API keys.
  - name: Reconciliation
    description: Read Siren's ledger to reconcile against your own records.
  - name: Collaborators
    description: |
      Affiliates and partners. Tracking and coupon codes live on
      `/collaborator-aliases` and program enrollments on
      `/collaborator-programs`. The collaborator record also carries them in
      its `aliases`, `referralCode` and `programs` fields.
  - name: Programs
    description: Incentive rules that turn engagements into rewards.
  - name: Program Groups
    description: Sets of programs that compete for the same engagement.
  - name: Opportunities
    description: A tracked visitor's chance to convert.
  - name: Transactions
    description: Transactions and their line-item details.
  - name: Conversions
    description: Engagements that turned into a reward.
  - name: Engagements
    description: A collaborator's claim on an opportunity in one program. Read only.
  - name: Distributors
    description: Revenue pools shared among collaborators on a schedule.
  - name: Custom Currencies
    description: Points, store credit, and other organization-defined units, keyed by code.
  - name: Credits
    description: Store credit balances, ledger entries, checkout holds, and adjustments.
  - name: Mappings
    description: Links between collaborators and records outside Siren, such as WordPress users and products.
  - name: Settings
    description: The organization settings Siren shares with a connected site.
  - name: Collaborator Groups
    description: Named sets of collaborators that programs and distributors target.
paths:
  /event/sale:
    post:
      tags: [Events]
      operationId: recordSale
      summary: Record a completed sale
      description: |
        Records a sale so conversions and payouts compute for the attributed
        collaborator. `total` is in major currency units (9.99 = $9.99). If
        `items` are supplied, reward pools compute `amount × quantity` per line;
        otherwise `total` is treated as one line. The body says what Siren
        recorded. Sending the same `(source, externalId)` again records nothing
        and answers `duplicate`. While the organization's engine is paused the
        sale is queued and the answer is 202.
      security:
        - apiKey: []
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalePayload' }
      responses:
        '200':
          description: Sale processed.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleResult' }
        '202': { $ref: '#/components/responses/EventQueued' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500':
          description: The sale could not be recorded, and nothing was saved. It is safe to send it again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /event/refund:
    post:
      tags: [Events]
      operationId: recordRefund
      summary: Record a refund
      description: |
        Reverses a previously recorded sale, matched by `(externalId, source)`.
        Returns 404 if no matching sale transaction exists. The answer has no
        body. While the organization's engine is paused the refund is queued
        and the answer is 202.
      security:
        - apiKey: []
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundPayload' }
      responses:
        '200':
          description: Refund processed. No body.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
        '202': { $ref: '#/components/responses/EventQueued' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /event/site-visited:
    post:
      tags: [Events]
      operationId: recordSiteVisited
      summary: Record a referred visit
      description: |
        Records a referred visit and opens an opportunity attributed to the
        given collaborator, when the collaborator exists and is active. The
        body says whether the visit was attributed. A connected site's token
        may send this event. While the organization's engine is paused the
        visit is queued, and the 202 body names the opportunity it will be
        recorded on.
      security:
        - apiKey: []
        - connectorToken: []
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteVisitedPayload' }
      responses:
        '200':
          description: Visit processed.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteVisitedResult' }
        '202': { $ref: '#/components/responses/EventQueued' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /event/{eventSlug}:
    post:
      tags: [Events]
      operationId: recordEvent
      summary: Record a custom event
      description: |
        Ingests any event type registered on the organization, including custom
        event types. The three built-in slugs are `sale`, `refund`, and
        `site-visited`. An API key needs `event:*` or `event:{eventSlug}`. A
        connected site's token sends the events its integrations forward,
        such as `sale-triggered`, and those need their exact `event:{slug}`
        scope on an API key, because no wildcard reaches them. Most events
        answer with no body.
      security:
        - apiKey: []
        - connectorToken: []
        - dashboardSession: []
      parameters:
        - name: eventSlug
          in: path
          required: true
          schema: { type: string }
          example: loyalty-points-earned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event processed.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
        '202': { $ref: '#/components/responses/EventQueued' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No event type with this slug is registered (`Unknown event`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      description: |
        Pages with `number` (1 to 200, default 200) and `offset`. An
        organization holds at most 100 subscriptions.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/Number'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Subscriptions (bare array).
          headers:
            x-siren-estimated-count:
              schema: { type: integer }
              description: Total number of subscriptions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Webhooks]
      operationId: createWebhookSubscription
      summary: Create a webhook subscription
      description: |
        Registers a URL to receive event callbacks. The response includes
        `signingSecret`, returned **once** — store it to verify future
        deliveries. Deliveries are signed with
        `X-Siren-Signature: sha256=<hmac-sha256(rawBody, signingSecret)>`.
        The body of each delivery is the event's payload. The `X-Siren-Event`
        header names the event and `X-Siren-Delivery` carries the delivery id.
        Siren answers 400 once the organization holds 100 subscriptions.
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookSubscriptionCreate' }
      responses:
        '201':
          description: Subscription created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookSubscription'
                  - type: object
                    properties:
                      signingSecret:
                        type: string
                        description: HMAC signing secret. Returned once.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /webhooks/events:
    get:
      tags: [Webhooks]
      operationId: listWebhookEvents
      summary: List the event types a subscription can name
      description: |
        The live catalog of events Siren delivers, in the order the dashboard
        shows them.
      security:
        - dashboardSession: []
      responses:
        '200':
          description: The catalog (bare array).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookCatalogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /webhooks/{id}:
    get:
      tags: [Webhooks]
      operationId: getWebhookSubscription
      summary: Get a webhook subscription
      security:
        - dashboardSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Subscription (bare object).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhookSubscription
      summary: Delete a webhook subscription
      security:
        - dashboardSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api-keys:
    get:
      tags: [API Keys]
      operationId: listApiKeys
      summary: List API keys
      description: Pages with `number` (1 to 200, default 200) and `offset`.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/Number'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: API keys (bare array, without raw key material).
          headers:
            x-siren-estimated-count:
              schema: { type: integer }
              description: Total number of keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [API Keys]
      operationId: createApiKey
      summary: Create an API key
      description: |
        Creates a new API key. The plaintext `rawKey` (`sk_live_...`) is
        returned **once** and cannot be retrieved later. A key sends events
        and does nothing else, so it holds event scopes only. Siren answers
        400 for a missing or empty `scopes`, for a record scope such as
        `programs:read`, and once the organization holds 250 active keys.
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreate' }
      responses:
        '201':
          description: API key created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    properties:
                      rawKey:
                        type: string
                        description: Plaintext key. Returned once.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api-keys/scopes:
    get:
      tags: [API Keys]
      operationId: listApiKeyScopes
      summary: List the scopes a new key may hold
      security:
        - dashboardSession: []
      responses:
        '200':
          description: The event scopes, grouped under `events`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        scope: { type: string, example: 'event:*' }
                        resource: { type: string, example: events }
                        action: { type: string }
                        label: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api-keys/{id}:
    delete:
      tags: [API Keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      security:
        - dashboardSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Revoked. The body is the revoked key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collaborators:
    get:
      tags: [Collaborators]
      operationId: listCollaborators
      summary: List collaborators
      description: |
        Filters on `id`, `status`, `fullName`, `nickname`, and `email` match exactly, and a
        comma-separated value means "any of". `s` searches name, nickname, email, and
        tracking codes. Ask for `aliases`, `referralCode`, `programs`, `distributors`,
        `creditBalances`, or `groups` through `fields`.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - name: orderBy
          in: query
          schema: { type: string, enum: [id, status, fullName, nickname, email, dateCreated, dateModified] }
        - name: id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: fullName
          in: query
          schema: { type: string }
        - name: nickname
          in: query
          schema: { type: string }
        - name: email
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/Search' }
        - name: programId
          in: query
          schema: { type: integer }
          description: Only collaborators enrolled in this program.
        - name: distributorId
          in: query
          schema: { type: integer }
          description: Only collaborators this distributor covers.
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Collaborators]
      operationId: createCollaborator
      summary: Create a collaborator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, nickname, email, status]
              properties:
                fullName: { type: string }
                nickname: { type: string }
                email: { type: string, format: email }
                status: { type: string, enum: [active, inactive, pending] }
                trackingId: { type: string, description: The tracking code. One is generated when empty. }
                programs: { type: array, items: { type: integer } }
                distributors: { type: array, items: { type: integer } }
                groups: { type: array, items: { type: integer } }
      responses:
        '201':
          description: |
            Created. When a connected site names someone the organization
            already has and the site does not, Siren Cloud answers 201 with a
            held record for the site: its own `id`, status `pending`, no
            tracking code. Siren emails the person to confirm, then merges
            the held record into their collaborator and deletes it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: The email belongs to a held record that waits for its person (`error.code` `reserved_address`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /collaborators/{id}:
    get:
      tags: [Collaborators]
      operationId: getCollaborator
      summary: Get a collaborator
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Fields' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Collaborators]
      operationId: updateCollaborator
      summary: Update a collaborator
      description: |
        Send only the fields to change. `programs` replaces the collaborator's
        program enrollments, and `trackingId` gives them a new tracking code.
        A connected site may send only `fullName`, `nickname` and custom
        `fields`. Siren Cloud answers any other field from a site with 403
        `field_not_allowed`, and a collaborator that does not belong to the
        site with 403 `collaborator_not_on_site`.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                nickname: { type: string }
                email: { type: string, format: email }
                status: { type: string, enum: [active, inactive, pending, rejected] }
                trackingId: { type: string, description: A new tracking code. Empty leaves it unchanged. }
                programs: { type: array, items: { type: integer }, description: Replaces every program enrollment. }
                distributors: { type: array, items: { type: integer } }
                groups: { type: array, items: { type: integer } }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Collaborators]
      operationId: deleteCollaborator
      summary: Delete a collaborator
      description: |
        The first call marks the record `deleted` and returns it. A second call on a
        deleted record removes it and answers 204.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collaborators/bulk:
    post:
      tags: [Collaborators]
      operationId: bulkCollaborators
      summary: Run a bulk action on collaborators
      description: |
        `addToProgram` and `removeFromProgram` enroll and unenroll collaborators in
        one program without touching their other enrollments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action: { type: string, enum: [activate, deactivate, restore, delete, permanent_delete, addToProgram, removeFromProgram, addToDistributor, removeFromDistributor, sendSignupEmail] }
                ids: { type: array, items: { type: integer } }
                programId: { type: integer, description: Required by addToProgram and removeFromProgram. }
                distributorId: { type: integer, description: Required by addToDistributor and removeFromDistributor. }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /collaborators/status-types:
    get:
      tags: [Collaborators]
      operationId: listCollaboratorStatusTypes
      summary: List collaborator statuses
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collaborators/generate-referral-code:
    get:
      tags: [Collaborators]
      operationId: generateReferralCode
      summary: Suggest an unused tracking code
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /programs:
    get:
      tags: [Programs]
      operationId: listPrograms
      summary: List programs
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - name: orderBy
          in: query
          schema: { type: string, enum: [id, name, description, incentiveType, incentiveResolverType, status, units, dateCreated, dateModified] }
        - name: status
          in: query
          schema: { type: string }
        - name: incentiveType
          in: query
          schema: { type: string }
        - name: incentiveResolverType
          in: query
          schema: { type: string }
        - name: units
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/Search' }
        - name: programGroupId
          in: query
          schema: { type: integer }
          description: Only programs in this program group.
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Programs]
      operationId: createProgram
      summary: Create a program
      requestBody:
        required: true
