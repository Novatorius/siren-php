        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /currencies/custom/{code}:
    put:
      tags: [Custom Currencies]
      operationId: updateCustomCurrency
      summary: Update a custom currency
      description: |
        The type cannot change. Siren answers 400 when the body sends `type`.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: PTS }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                symbol: { type: string }
                symbolPosition: { type: string, enum: [before, after] }
                exchangeRate: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Custom Currencies]
      operationId: deleteCustomCurrency
      summary: Delete a custom currency
      description: |
        Sets every program that pays in the currency to `inactive`, deletes the
        currency, and answers `{success, deactivatedPrograms}`. With
        `wipeLedger` true, the ledger entries in the currency are deleted too.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: PTS }
        - name: wipeLedger
          in: query
          schema: { type: boolean }
          description: Also delete the ledger entries that use the currency.
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /credits/adjust:
    post:
      tags: [Credits]
      operationId: adjustCreditBalance
      summary: Adjust a collaborator's credit balance
      description: |
        Only a dashboard session may adjust a balance. Read balances with
        `GET /credit-balances` and the ledger with `GET /credit-entries`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId, currency, amount]
              properties:
                collaboratorId: { type: integer }
                currency: { type: string, description: An internal custom currency code. }
                amount: { type: integer, description: Minor units. Negative takes credit away. Must not be zero. }
                description: { type: string }
      responses:
        '200':
          description: Adjusted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /credit-balances:
    get:
      tags: [Credits]
      operationId: getCreditBalances
      summary: Read a collaborator's store credit for a checkout
      description: |
        One row per internal currency. `balance` is the ledger sum, `reserved`
        the live holds, and `available` the balance less reserved, never below
        zero, all in minor units. Pass the checkout's own hold reference as
        `excludeReference` so its hold does not count against itself. A
        connected site sends the plain reference and Cloud adds its Property.
      parameters:
        - { name: collaboratorId, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: currency, in: query, schema: { type: string, maxLength: 50 }, description: Just this internal currency. }
        - name: excludeReference
          in: query
          schema: { $ref: '#/components/schemas/HoldReference' }
      responses:
        '200':
          description: The balances.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CreditBalance' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /credit-entries:
    get:
      tags: [Credits]
      operationId: listCreditEntries
      summary: List store credit ledger entries
      description: |
        A query must name `collaboratorId` or `idempotencyKey`, so it never
        lists a whole organization's ledger. Every filter is an exact match.
        Only Siren writes the ledger.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [id, dateCreated, amount], default: id } }
        - { name: collaboratorId, in: query, schema: { type: integer } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: sourceType, in: query, schema: { type: string } }
        - { name: sourceId, in: query, schema: { type: string } }
        - { name: description, in: query, schema: { type: string } }
        - { name: idempotencyKey, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /credit-holds:
    get:
      tags: [Credits]
      operationId: listCreditHolds
      summary: List store credit holds
      description: |
        A query must name `collaboratorId`, `reference` or `idempotencyKey`.
        Every filter is an exact match. A connected site reads only the holds
        its own checkouts placed, and their references come back with its
        Property, as in `hold:woocommerce@property:5:{token}`.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [id, dateCreated, expiresAt], default: id } }
        - { name: collaboratorId, in: query, schema: { type: integer } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, settled, released, expired] } }
        - { name: reference, in: query, schema: { $ref: '#/components/schemas/HoldReference' } }
        - { name: idempotencyKey, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Credits]
      operationId: placeCreditHold
      summary: Reserve store credit for a checkout
      description: |
        Placing again for the same token and currency replaces that session's
        hold. The hold's `amount` may be lower than asked, because Siren caps
        it at the credit available outside this session's own hold. A hold
        lapses at its `ttl`, the site can release it early with
        `DELETE /credit-holds/{id}`, and Siren settles it when the order's
        redemption arrives as an event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId, currency, amount, token, platformId]
              properties:
                collaboratorId: { type: integer, minimum: 1 }
                currency: { type: string, description: An internal custom currency code. }
                amount: { type: integer, minimum: 1, description: Minor units. }
                token: { $ref: '#/components/schemas/SiteName', description: 'The checkout session, at most 120 characters.' }
                platformId: { $ref: '#/components/schemas/SiteName', description: 'The commerce platform, such as woocommerce, at most 60 characters. Plain. Cloud adds the Property.' }
                ttl: { type: integer, minimum: 60, maximum: 3600, default: 1800 }
      responses:
        '201':
          description: Placed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditHold' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            No credit is available in that currency (`error.code`
            `hold_no_credit`), or another site's checkout already holds
            credit for this collaborator and currency under the same token
            (`hold_token_in_use`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            The collaborator already holds credit for ten other live checkouts
            on this site (`error.code` `hold_limit`, no `Retry-After`), or the
            site spent its request budget (with `Retry-After`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /credit-holds/{id}:
    delete:
      tags: [Credits]
      operationId: releaseCreditHold
      summary: Release a store credit hold early
      description: |
        Releases one hold, so the credit it reserved is available again. Call
        it only when the shopper abandons the credit, or it no longer applies
        to a cart that never became an order. Never release the hold of a
        checkout that became an order: settlement consumes that hold, and
        releasing it first lets another checkout spend the same credit.
        A hold that already ended (released, expired or settled) comes back
        unchanged with 200, so a retry is safe. A connected site may release
        only holds its own checkouts placed, and any other id answers 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The hold, now released, or as it was when it had already ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditHold' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /collaborator-aliases:
    get:
      tags: [Collaborators]
      operationId: listCollaboratorAliases
      summary: Find tracking and coupon codes
      description: |
        Every filter is an exact match, and `type` matches the plain type in
        every namespace, so `coupon` also finds a site's `coupon@property:5`.
        Newest first. `?code=SAVE10&type=coupon&number=1` answers "who holds
        this coupon". A connected site sends one plain type.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: order, in: query, schema: { type: string, enum: [ASC, DESC], default: DESC } }
        - { name: orderBy, in: query, schema: { type: string, enum: [dateIssued, code, type, collaboratorId], default: dateIssued } }
        - { name: code, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/SiteName' }, example: coupon }
        - { name: collaboratorId, in: query, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Collaborators]
      operationId: createCollaboratorAlias
      summary: Give a collaborator a code
      description: |
        A code has one holder per type across every namespace. Cloud files a
        connected site's code under the site's Property.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, type, collaboratorId]
              properties:
                code: { type: string }
                type: { $ref: '#/components/schemas/SiteName' }
                collaboratorId: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alias' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Someone already holds the code under this type, in any namespace (`error.code` `code_held`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Collaborators]
      operationId: freeCollaboratorAlias
      summary: Free one code of one type
      description: |
        A connected site frees only codes in its own namespace. Freeing a code
        nobody holds answers 200 too.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { $ref: '#/components/schemas/SiteName' } }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /collaborator-programs:
    get:
      tags: [Collaborators]
      operationId: listCollaboratorPrograms
      summary: List program enrollments
      description: One row `{collaboratorId, programId}` per enrollment. A comma-separated value matches any of its values.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [collaboratorId, programId], default: collaboratorId } }
        - { name: collaboratorId, in: query, schema: { type: string }, example: '4' }
        - { name: programId, in: query, schema: { type: string }, example: '2,3' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Collaborators]
      operationId: addCollaboratorToProgram
      summary: Enroll a collaborator in a program
      description: |
        Enrolling someone already enrolled changes nothing and still answers
        201. A connected site may only name a program that runs on its own
        Property.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId, programId]
              properties:
                collaboratorId: { type: integer, minimum: 1 }
                programId: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Enrolled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Collaborators]
      operationId: removeCollaboratorFromProgram
      summary: End one enrollment
      description: Removing an enrollment that does not exist answers 200 too. A connected site may only name a program that runs on its own Property.
      parameters:
        - { name: collaboratorId, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: programId, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /mappings:
    get:
      tags: [Mappings]
      operationId: listMappings
      summary: Find links to records outside Siren
      description: |
        A query must name a type. A connected site must name `externalType`,
        reads only its own namespace, and may never use the `user` type.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [localId, externalId, localType, externalType], default: localId } }
        - { name: localId, in: query, schema: { type: integer } }
        - { name: localType, in: query, schema: { $ref: '#/components/schemas/SiteName' }, example: collaborator }
        - { name: externalId, in: query, schema: { type: string } }
        - { name: externalType, in: query, schema: { $ref: '#/components/schemas/SiteName' }, example: wordpress_user }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Mappings]
      operationId: createMapping
      summary: Link a collaborator to an outside record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [localId, localType, externalId, externalType]
              properties:
                localId: { type: integer, minimum: 1, description: A collaborator id. }
                localType: { type: string, enum: [collaborator] }
                externalId: { type: string }
                externalType: { $ref: '#/components/schemas/SiteName' }
      responses:
        '201':
          description: Linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mapping' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The link already exists (`error.code` `mapping_exists`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Mappings]
      operationId: deleteMappings
      summary: Remove collaborator links
      description: |
        Send `localId`, or `externalId` with its `externalType`. A connected
        site always sends `externalType`.
      parameters:
        - { name: localType, in: query, required: true, schema: { type: string, enum: [collaborator] } }
        - { name: localId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: externalId, in: query, schema: { type: string } }
        - { name: externalType, in: query, schema: { $ref: '#/components/schemas/SiteName' } }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /configs:
    get:
      tags: [Settings]
      operationId: listSharedConfigs
      summary: Read the settings shared with a connected site
      description: |
        Only named settings leave Cloud. Today that is `collaborator` /
        `urlReference` / `key`, the referral link's query parameter.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [type, subtype, configKey], default: type } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [collaborator] } }
        - { name: subtype, in: query, schema: { type: string }, example: urlReference }
        - { name: configKey, in: query, schema: { type: string }, example: key }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /collaborator-groups:
    get:
      tags: [Collaborator Groups]
      operationId: listCollaboratorGroups
      summary: List collaborator groups
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - name: orderBy
          in: query
          schema: { type: string, enum: [id, name, description, structure, dateCreated, dateModified] }
        - name: structure
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Collaborator Groups]
      operationId: createCollaboratorGroup
      summary: Create a collaborator group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, structure]
              properties:
                name: { type: string }
                description: { type: string }
                structure: { type: string, example: flat }
                members: { type: array, items: { $ref: '#/components/schemas/GroupMember' } }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /collaborator-groups/{id}:
    get:
      tags: [Collaborator Groups]
      operationId: getCollaboratorGroup
      summary: Get a collaborator group
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Fields' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Collaborator Groups]
      operationId: updateCollaboratorGroup
      summary: Update a collaborator group
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                structure: { type: string }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Collaborator Groups]
      operationId: deleteCollaboratorGroup
      summary: Delete a collaborator group
      description: |
        Deletes the group for good and answers 204.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collaborator-groups/{id}/members:
    get:
      tags: [Collaborator Groups]
      operationId: listCollaboratorGroupMembers
      summary: List a group's members
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - name: orderBy
          in: query
          schema: { type: string, enum: [id, groupId, collaboratorId, dateCreated, dateModified] }
        - { $ref: '#/components/parameters/Id' }
        - name: collaboratorId
          in: query
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Collaborator Groups]
      operationId: addCollaboratorGroupMembers
      summary: Add members to a group
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                members: { type: array, items: { $ref: '#/components/schemas/GroupMember' } }
      responses:
        '200':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    put:
      tags: [Collaborator Groups]
      operationId: setCollaboratorGroupMembers
      summary: Replace a group's members
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                members: { type: array, items: { $ref: '#/components/schemas/GroupMember' } }
      responses:
        '200':
          description: Replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /collaborator-groups/{id}/members/{collaboratorId}:
    delete:
      tags: [Collaborator Groups]
      operationId: removeCollaboratorGroupMember
      summary: Remove a member from a group
      description: |
        Removes one collaborator from the group.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: collaboratorId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collaborator-groups/structures:
    get:
      tags: [Collaborator Groups]
      operationId: listCollaboratorGroupStructures
      summary: List group structures
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /obligations:
    get:
      tags: [Reconciliation]
      operationId: listObligations
      summary: List obligations
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /payouts:
    get:
      tags: [Reconciliation]
      operationId: listPayouts
      summary: List payouts
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: sk_live_...
      description: An API key minted in the Siren dashboard or via createApiKey.
    connectorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A connected site's OAuth access token, issued by `POST /oauth/token`
        when an organization admin approves the site. It expires, and the
        site renews it with its refresh token. Siren answers 401 when it has
        expired, or when the site was revoked. A site asks for
        `connect:* connect:webhooks connect:records:read connect:records:write`.
        Cloud files the types, platforms and tokens a site writes under the
        site's Property (`coupon@property:5`) and takes the Property from the
        token.
  headers:
    XSirenOID:
      description: The opportunity (tracking) id associated with the event.
      schema: { type: integer }
  parameters:
    Number:
      name: number
      in: query
      description: |
        Page size. Siren answers 400 outside 1 to 200. The PHP SDK also accepts
        `perPage` and `page` and turns them into `number` and `offset`.
      schema: { type: integer, minimum: 1, maximum: 200, default: 10 }
    Offset:
      name: offset
      in: query
      description: The first row to return, counting from 0.
      schema: { type: integer, minimum: 0, default: 0 }
    Fields:
      name: fields
      in: query
      description: Comma-separated fields to return. Each list has a default set.
      schema: { type: string }
      example: id,status,dateCreated
    Order:
      name: order
      in: query
      schema: { type: string, enum: [ASC, DESC] }
    Search:
      name: s
      in: query
      description: A search term matched against the resource's text columns.
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    Record:
      type: object
      description: |
        A Siren record. The fields present depend on the resource and on the
        `fields` the request asked for.
      additionalProperties: true
    ListEnvelope:
      type: object
      required: [items, total, page, perPage, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Record' }
        total: { type: integer, description: Records across all pages. }
        page: { type: integer, description: 'floor(offset / number) + 1' }
        perPage: { type: integer, description: The page size used. }
        totalPages: { type: integer }
    SiteName:
      type: string
      pattern: '^[A-Za-z0-9_-]+$'
      description: |
        A plain type, platform or token: letters, digits, underscores and
        hyphens. Cloud refuses an `@` qualifier or a comma from a connected
        site, and adds the site's Property itself.
    HoldReference:
      type: string
      pattern: '^hold:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+$'
      description: A checkout session's hold reference, `hold:{platform}:{token}`, as a site sends it.
      example: hold:woocommerce:0b6f3c2e-8a1d-4c55-9a0e-0d6c1b7f4e21
    Alias:
      type: object
      properties:
        code: { type: string, example: SAVE10 }
        type: { type: string, description: 'Qualified for a connected site, as in coupon@property:5. The PHP SDK returns the plain type and the Property in propertyId.' }
        collaboratorId: { type: integer }
        dateIssued: { type: string }
    Enrollment:
      type: object
      properties:
        collaboratorId: { type: integer }
        programId: { type: integer }
    Mapping:
      type: object
      properties:
        localId: { type: integer }
        localType: { type: string, example: collaborator }
        externalId: { type: string }
        externalType: { type: string, description: 'Qualified for a connected site, as in wordpress_user@property:5. The PHP SDK returns the plain type and the Property in propertyId.' }
    CreditBalance:
      type: object
      properties:
        collaboratorId: { type: integer }
        currency: { type: string }
        balance: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
    CreditHold:
      type: object
      properties:
        id: { type: integer }
        collaboratorId: { type: integer }
        currency: { type: string }
        amount: { type: integer }
        status: { type: string, enum: [active, settled, released, expired] }
        reference: { type: string, example: 'hold:woocommerce@property:5:0b6f3c2e-8a1d-4c55-9a0e-0d6c1b7f4e21' }
        idempotencyKey: { type: [string, 'null'] }
        expiresAt: { type: string }
        createdDate: { type: string }
    TransactionDetail:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        description: { type: string }
        type: { type: string, example: credit }
        value: { type: integer, description: Per-unit value in minor units. }
        quantity: { type: integer, default: 1 }
        units: { type: string, example: USD }
        attributes: { type: object, additionalProperties: true }
    GroupMember:
      type: object
      required: [collaboratorId]
      properties:
        collaboratorId: { type: integer, minimum: 1 }
        metadata:
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
    SalePayload:
      type: object
      required: [source, externalId, total, trackingId]
      properties:
        source:
          type: string
          description: Commerce source identifier.
          example: stripe
        externalId:
          type: string
          description: Your order/transaction id; used to match refunds later.
          example: cs_test_a1b2c3
        total:
          type: number
          description: Order total in major currency units.
          example: 49.99
        trackingId:
          type: integer
          description: Opportunity id from the Siren tracking cookie / attribution.
          example: 4021
        currency:
          type: string
          description: ISO currency code.
          default: USD
        items:
          type: array
          items: { $ref: '#/components/schemas/LineItem' }
    LineItem:
      type: object
      required: [name, quantity, amount]
      properties:
        externalId: { type: string }
        name: { type: string, example: Pro Plan (annual) }
        quantity: { type: integer, minimum: 1, default: 1 }
        amount:
          type: number
          description: Per-unit price in major currency units.
          example: 49.99
    RefundPayload:
      type: object
      required: [source, externalId]
      properties:
        source: { type: string, example: stripe }
        externalId: { type: string, example: cs_test_a1b2c3 }
    SiteVisitedPayload:
      type: object
      required: [collaboratorId]
      properties:
        collaboratorId: { type: integer, example: 88 }
        userId: { type: integer, example: 12345 }
    WebhookSubscription:
      type: object
      properties:
        id: { type: integer }
        targetUrl: { type: string, format: uri }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        description: { type: string }
        status: { type: string, example: active }
        createdAt: { type: string, format: date-time }
    WebhookSubscriptionCreate:
      type: object
      required: [targetUrl, events]
      properties:
        targetUrl: { type: string, format: uri, example: https://example.com/webhooks/siren }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
          example: ['conversion.approved', 'payout.paid']
        description: { type: string }
    WebhookEventType:
      type: string
      description: A subscribable event type. Use `*` to subscribe to all.
      enum:
        - '*'
        - allocation.completed
        - collaborator.created
        - collaborator.registered
        - conversion.approved
        - conversion.created
        - conversion.rejected
        - conversion.renewed
        - coupon.applied
        - credit.issued
        - credit.redeemed
        - currency.created
        - currency.deleted
        - distribution.completed
        - engagement.awarded
        - engagement.completed
        - engagement.created
        - fulfillment.created
        - fulfillment.updated
        - lead.created
        - metrics.updated
        - obligation.completed
        - obligation.created
        - opportunity.created
        - opportunity.invalidated
        - payout.created
        - payout.paid
        - refund.created
        - renewal.created
        - sale.created
        - transaction.completed
        - transaction.created
    ApiKey:
      type: object
      properties:
        id: { type: integer }
        keyPrefix: { type: string, example: sk_live_a1b2c3d4 }
        label: { type: string }
        status: { type: string, example: active }
        scopes:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    ApiKeyCreate:
      type: object
      required: [label]
      properties:
        label: { type: string, example: Production server }
        scopes:
          type: array
          items: { type: string }
          description: Omit for full access.
    Error:
      type: object
      description: |
        `error` is polymorphic. Some endpoints return a plain string message,
        and structured errors return an object with `message`, `code` and
        `data` or `context`. Clients must handle both. A connector's 401, 403,
        409 and hold cap 429 carry a stable `code` (see `ErrorCode` in the
        SDK): `site_disconnected`, `missing_scope`, `field_not_allowed`,
        `pending_status_required`, `user_type_not_allowed`,
        `program_not_on_site`, `not_permitted`, `plan_required`,
        `admin_required`, `code_held`,
        `mapping_exists`, `hold_no_credit`, `hold_token_in_use` and
        `hold_limit`. Branch on the code, not the message.
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                message: { type: string }
                code: { type: string }
                data: { type: object, additionalProperties: true }
                context:
                  type: object
                  additionalProperties: true
                  description: |
                    Sent by the record routes. A failed validation carries
                    `type: VALIDATION_FAILED` and `failedValidations`, a map
                    of field name to messages.
  responses:
    PaginatedList:
      description: |
        One page of records in Siren's list envelope. The total also appears
        in the `x-siren-estimated-count` response header.
      headers:
        x-siren-estimated-count:
          schema: { type: integer }
          description: Total number of records across all pages.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ListEnvelope' }
    Record:
      description: A record, or the result of an action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Record' }
    Deleted:
      description: Removed, or nothing matched.
      content:
        application/json:
          schema:
            type: object
            properties:
              deleted: { type: boolean, const: true }
    BadRequest:
      description: A query parameter is out of range, such as `number` above 200.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The record would duplicate one that exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        The credential may not do this. For a connected site, `error.code`
        `missing_scope` means the site must reconnect, and
        `error.context.scope` names the scope. The codes
        `field_not_allowed`, `pending_status_required`,
        `user_type_not_allowed`, `program_not_on_site` and `not_permitted`
        are policy refusals, and `error.context.param` names the refused
        field when there is one. `plan_required` means the plan does not
        include the feature, and `admin_required` that only an admin may do
        this.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: |
        The request body failed validation. The record routes answer 400 with
        `error.context.failedValidations`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
