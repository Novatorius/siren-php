openapi: 3.1.0
info:
  title: Siren Affiliate Platform API
  version: 0.1.0
  summary: Headless affiliate & incentive tracking API for the Siren SaaS.
  description: |
    The Siren API lets any commerce stack record sales, refunds, and referred
    visits, subscribe to program events via signed webhooks, and reconcile
    Siren's ledger against its own.

    This document describes the **developer and connector surface**: event
    ingestion, webhooks, API keys, and the record endpoints a connector (such
    as the Siren WordPress plugin connected to Siren Cloud) reads and writes:
    collaborators and their tracking codes and program enrollments,
    programs, program groups, opportunities, transactions, conversions,
    engagements, distributors, custom currencies, store credit, and
    collaborator groups.

    Requests authenticate with a bearer token. Event ingestion
    (`POST /event/{eventSlug}`) accepts an organization API key
    (`Authorization: Bearer sk_live_...`) or a connected site's OAuth access
    token. The record routes accept a signed-in dashboard session, and a
    connected site's token on the routes Siren Cloud opens to connectors,
    when the token holds `connect:records:read` for reads or
    `connect:records:write` for writes. Those are explicit scopes, so
    `connect:*` does not grant them. A site writes only collaborators (as
    `pending`, without program, distributor or group lists, and never a
    status or email on update), codes, enrollments, collaborator mappings and
    credit holds. A 403 that names a scope means the site must reconnect.
    Any other 403 is a policy refusal. A 401 saying the site is no longer
    connected means it was revoked.

    Successful responses are bare JSON: an object for one record, and the
    list envelope `{ "items", "total", "page", "perPage", "totalPages" }`
    for lists. Lists page with `number` (page size, at most 200) and
    `offset`. Failures return `{ "error": ... }`, where `error` is a string
    or `{ "message", "code", "data" }`.

    Record deletes are two-stage. The first DELETE marks the record
    `deleted` and returns it, and a second DELETE removes it.
  contact:
    name: Siren
    url: https://sirenaffiliates.com
  license:
    name: Proprietary
servers:
  - url: https://api.sirenaffiliates.com/siren/v1
    description: Production
  - url: http://localhost:8080/siren/v1
    description: Local development
security:
  - apiKey: []
  - connectorToken: []
tags:
  - name: Events
    description: Ingest commerce and tracking events.
  - name: Webhooks
    description: Subscribe to program events; delivered as signed HTTP callbacks.
  - name: API Keys
    description: Manage API keys.
  - name: Reconciliation
    description: Read Siren's ledger to reconcile against your own records.
  - name: Collaborators
    description: |
      Affiliates and partners. Tracking and coupon codes live on
      `/collaborator-aliases` and program enrollments on
      `/collaborator-programs`. The collaborator record also carries them in
      its `aliases`, `referralCode` and `programs` fields.
  - name: Programs
    description: Incentive rules that turn engagements into rewards.
  - name: Program Groups
    description: Sets of programs that compete for the same engagement.
  - name: Opportunities
    description: A tracked visitor's chance to convert.
  - name: Transactions
    description: Transactions and their line-item details.
  - name: Conversions
    description: Engagements that turned into a reward.
  - name: Engagements
    description: A collaborator's claim on an opportunity in one program. Read only.
  - name: Distributors
    description: Revenue pools shared among collaborators on a schedule.
  - name: Custom Currencies
    description: Points, store credit, and other organization-defined units, keyed by code.
  - name: Credits
    description: Store credit balances, ledger entries, checkout holds, and adjustments.
  - name: Mappings
    description: Links between collaborators and records outside Siren, such as WordPress users and products.
  - name: Settings
    description: The organization settings Siren shares with a connected site.
  - name: Collaborator Groups
    description: Named sets of collaborators that programs and distributors target.
paths:
  /event/sale:
    post:
      tags: [Events]
      operationId: recordSale
      summary: Record a completed sale
      description: |
        Records a sale so conversions and payouts compute for the attributed
        collaborator. `total` is in major currency units (9.99 = $9.99). If
        `items` are supplied, reward pools compute `amount × quantity` per line;
        otherwise `total` is treated as one line. The opportunity id is returned
        in the `X-Siren-OID` response header.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalePayload' }
      responses:
        '200':
          description: Sale accepted.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /event/refund:
    post:
      tags: [Events]
      operationId: recordRefund
      summary: Record a refund
      description: |
        Reverses a previously recorded sale, matched by `(externalId, source)`.
        Returns 404 if no matching sale transaction exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundPayload' }
      responses:
        '200':
          description: Refund accepted.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /event/site-visited:
    post:
      tags: [Events]
      operationId: recordSiteVisited
      summary: Record a referred visit
      description: |
        Records a referred visit and opens an opportunity attributed to the
        given collaborator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteVisitedPayload' }
      responses:
        '200':
          description: Visit accepted.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /event/{eventSlug}:
    post:
      tags: [Events]
      operationId: recordEvent
      summary: Record a custom event
      description: |
        Ingests any event type registered on the organization, including custom
        event types. The three built-in slugs are `sale`, `refund`, and
        `site-visited`.
      parameters:
        - name: eventSlug
          in: path
          required: true
          schema: { type: string }
          example: loyalty-points-earned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event accepted.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      responses:
        '200':
          description: Subscriptions (bare array).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Webhooks]
      operationId: createWebhookSubscription
      summary: Create a webhook subscription
      description: |
        Registers a URL to receive event callbacks. The response includes
        `signingSecret`, returned **once** — store it to verify future
        deliveries. Deliveries are signed with
        `X-Siren-Signature: sha256=<hmac-sha256(rawBody, signingSecret)>`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookSubscriptionCreate' }
      responses:
        '201':
          description: Subscription created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookSubscription'
                  - type: object
                    properties:
                      signingSecret:
                        type: string
                        description: HMAC signing secret. Returned once.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /webhooks/{id}:
    get:
      tags: [Webhooks]
      operationId: getWebhookSubscription
      summary: Get a webhook subscription
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Subscription (bare object).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhookSubscription
      summary: Delete a webhook subscription
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api-keys:
    get:
      tags: [API Keys]
      operationId: listApiKeys
      summary: List API keys
      responses:
        '200':
          description: API keys (bare array, without raw key material).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [API Keys]
      operationId: createApiKey
      summary: Create an API key
      description: |
        Creates a new API key. The plaintext `rawKey` (`sk_live_...`) is
        returned **once** and cannot be retrieved later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreate' }
      responses:
        '201':
          description: API key created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    properties:
                      rawKey:
                        type: string
                        description: Plaintext key. Returned once.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api-keys/{id}:
    delete:
      tags: [API Keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collaborators:
    get:
      tags: [Collaborators]
      operationId: listCollaborators
      summary: List collaborators
      description: |
        Filters on `id`, `status`, `fullName`, `nickname`, and `email` match exactly, and a
        comma-separated value means "any of". `s` searches name, nickname, email, and
        tracking codes. Ask for `aliases`, `referralCode`, `programs`, `distributors`,
        `creditBalances`, or `groups` through `fields`.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - name: orderBy
          in: query
          schema: { type: string, enum: [id, status, fullName, nickname, email, dateCreated, dateModified] }
        - name: id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: fullName
          in: query
          schema: { type: string }
        - name: nickname
          in: query
          schema: { type: string }
        - name: email
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/Search' }
        - name: programId
          in: query
          schema: { type: integer }
          description: Only collaborators enrolled in this program.
        - name: distributorId
          in: query
          schema: { type: integer }
          description: Only collaborators this distributor covers.
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Collaborators]
      operationId: createCollaborator
      summary: Create a collaborator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, nickname, email, status]
              properties:
                fullName: { type: string }
                nickname: { type: string }
                email: { type: string, format: email }
                status: { type: string, enum: [active, inactive, pending] }
                trackingId: { type: string, description: The tracking code. One is generated when empty. }
                programs: { type: array, items: { type: integer } }
                distributors: { type: array, items: { type: integer } }
                groups: { type: array, items: { type: integer } }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /collaborators/{id}:
    get:
      tags: [Collaborators]
      operationId: getCollaborator
      summary: Get a collaborator
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Fields' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Collaborators]
      operationId: updateCollaborator
      summary: Update a collaborator
      description: |
        Send only the fields to change. `programs` replaces the collaborator's
        program enrollments, and `trackingId` gives them a new tracking code.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                nickname: { type: string }
                email: { type: string, format: email }
                status: { type: string, enum: [active, inactive, pending, rejected] }
                trackingId: { type: string, description: A new tracking code. Empty leaves it unchanged. }
                programs: { type: array, items: { type: integer }, description: Replaces every program enrollment. }
                distributors: { type: array, items: { type: integer } }
                groups: { type: array, items: { type: integer } }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Collaborators]
      operationId: deleteCollaborator
      summary: Delete a collaborator
      description: |
        The first call marks the record `deleted` and returns it. A second call on a
        deleted record removes it and answers 204.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collaborators/bulk:
    post:
      tags: [Collaborators]
      operationId: bulkCollaborators
      summary: Run a bulk action on collaborators
      description: |
        `addToProgram` and `removeFromProgram` enroll and unenroll collaborators in
        one program without touching their other enrollments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action: { type: string, enum: [activate, deactivate, restore, delete, permanent_delete, addToProgram, removeFromProgram, addToDistributor, removeFromDistributor, sendSignupEmail] }
                ids: { type: array, items: { type: integer } }
                programId: { type: integer, description: Required by addToProgram and removeFromProgram. }
                distributorId: { type: integer, description: Required by addToDistributor and removeFromDistributor. }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /collaborators/status-types:
    get:
      tags: [Collaborators]
      operationId: listCollaboratorStatusTypes
      summary: List collaborator statuses
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collaborators/generate-referral-code:
    get:
      tags: [Collaborators]
      operationId: generateReferralCode
      summary: Suggest an unused tracking code
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /programs:
    get:
      tags: [Programs]
      operationId: listPrograms
      summary: List programs
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - name: orderBy
          in: query
          schema: { type: string, enum: [id, name, description, incentiveType, incentiveResolverType, status, units, dateCreated, dateModified] }
        - name: status
          in: query
          schema: { type: string }
        - name: incentiveType
          in: query
          schema: { type: string }
        - name: incentiveResolverType
          in: query
          schema: { type: string }
        - name: units
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/Search' }
        - name: programGroupId
          in: query
          schema: { type: integer }
          description: Only programs in this program group.
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Programs]
      operationId: createProgram
      summary: Create a program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, status, incentiveType, incentiveResolverType, units, engagementTypes]
              properties:
                name: { type: string }
                description: { type: string }
                status: { type: string, enum: [active, inactive] }
                incentiveType: { type: string }
                incentiveResolverType: { type: string }
                units: { type: string, description: A currency code. }
                engagementTypes: { type: object, additionalProperties: true, description: "Engagement type to {calculationType, calculationArgs}." }
                incentiveTypeArgs: { type: object, additionalProperties: true }
                collaboratorIds: { type: array, items: { type: integer } }
                collaboratorGroupId: { type: integer }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /programs/{id}:
    get:
      tags: [Programs]
      operationId: getProgram
      summary: Get a program
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Fields' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Programs]
      operationId: updateProgram
      summary: Update a program
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                status: { type: string, enum: [active, inactive] }
                incentiveType: { type: string }
                incentiveResolverType: { type: string }
                units: { type: string }
                engagementTypes: { type: object, additionalProperties: true, description: Replaces the program's engagement rules. }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Programs]
      operationId: deleteProgram
      summary: Delete a program
      description: |
        The first call marks the record `deleted` and returns it. A second call on a
        deleted record removes it and answers 204.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /programs/bulk:
    post:
      tags: [Programs]
      operationId: bulkPrograms
      summary: Run a bulk action on programs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action: { type: string, enum: [activate, deactivate, restore, delete, permanent_delete] }
                ids: { type: array, items: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /programs/status-types:
    get:
      tags: [Programs]
      operationId: listProgramStatusTypes
      summary: List program statuses
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /programs/incentive-types:
    get:
      tags: [Programs]
      operationId: listProgramIncentiveTypes
      summary: List incentive types
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /programs/currency-types:
    get:
      tags: [Programs]
      operationId: listProgramCurrencyTypes
      summary: List program currencies
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /program-groups:
    get:
      tags: [Program Groups]
      operationId: listProgramGroups
      summary: List program groups
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - name: orderBy
          in: query
          schema: { type: string, enum: [id, name, description, sorter] }
        - name: sorter
          in: query
          schema: { type: string, enum: [oldestBindingWins, newestBindingWins] }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Program Groups]
      operationId: createProgramGroup
      summary: Create a program group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, sorter]
              properties:
                name: { type: string }
                description: { type: string }
                sorter: { type: string, enum: [oldestBindingWins, newestBindingWins] }
                programs: { type: array, items: { type: integer } }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
